<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 0; 
      margin: 0;
      background-color: #ffffff; 
      color: #334155; 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .card { 
      width: 100%;
      max-width: 420px; 
      background: transparent; 
      padding: 20px; 
      border: none;
      box-shadow: none;
    }

    h2 { 
      margin-top: 0; 
      color: #0f172a;
      font-size: 20px; 
      font-weight: 600;
      text-align: center; 
      margin-bottom: 40px; 
      letter-spacing: -0.3px;
    }

    .input-section { margin-bottom: 28px; }

    label { 
      display: block; 
      font-size: 11px; 
      font-weight: 600; 
      color: #64748b;
      text-transform: uppercase; 
      margin-bottom: 10px; 
      letter-spacing: 0.8px;
    }

    input { 
      width: 100%; 
      padding: 14px 16px; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      font-size: 15px; 
      box-sizing: border-box; 
      outline: none; 
      background-color: #f8fafc;
      color: #0f172a;
      transition: all 0.2s ease-in-out;
    }

    input:focus { 
      border-color: #2563eb; 
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .risk-container { 
      margin-top: 40px; 
      text-align: center; 
      border-top: 1px solid #f1f5f9; 
      padding-top: 35px; 
    }

    #risk-box {
      padding: 18px; 
      border-radius: 8px; 
      font-size: 14px; 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 0.8px;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .bg-low  { 
      background-color: #f0fdf4 !important; 
      color: #16a34a !important;
      border: 1px solid #bbf7d0;
    }
    .bg-mid  { 
      background-color: #fffbeb !important; 
      color: #d97706 !important; 
      border: 1px solid #fde68a;
    }
    .bg-high { 
      background-color: #fef2f2 !important; 
      color: #dc2626 !important; 
      border: 1px solid #fecaca;
    }
    .bg-grey { 
      background-color: #f1f5f9 !important; 
      color: #94a3b8 !important;
      border: 1px solid #e2e8f0;
    }

    .badge { 
      text-align: center; 
      font-size: 11px; 
      color: #94a3b8; 
      margin-top: 30px; 
    }
  </style>
</head>
<body>
<div class="card">
  <h2>Orbital Risk Analyzer</h2>

  <div class="input-section">
    <label>Satellite A</label>
    <input list="list-sats" id="sat1" placeholder="Search first satellite..." autocomplete="off">
  </div>
  <div class="input-section">
    <label>Satellite B</label>
    <input list="list-sats" id="sat2" placeholder="Search second satellite..." autocomplete="off">
  </div>
  <datalist id="list-sats"></datalist>

  <div class="risk-container">
    <div id="risk-box" class="bg-grey">LOADING DATA...</div>
  </div>
  <div class="badge" id="badge"></div>
</div>
  
<script>

  const SHEET_ID = "1Xo6oSmDzJvRmZ6sibyM34MXb0OlUT-whAIW5sfG_9MY";
  const GID      = "669546549";
  const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

  
  let pairMap = {};

  //parsing and loading
  async function loadData() {
    const box = document.getElementById('risk-box');
    try {
      const res  = await fetch(CSV_URL, { redirect: "follow" });
      if (!res.ok) 
      {throw new Error("HTTP " + res.status);}
      const text = await res.text();

      const allSatSet = new Set();
      pairMap = {};

      const rows = text.split(/\r?\n/).filter(l => l.trim());
      rows.slice(1).forEach(row => {
        
        //csv parsing
        const cols = [];
        let cur = "", inQ = false;
        for (const c of row) 
        {
          if (c === '"') 
          { inQ = !inQ; }
          else if (c === ',' && !inQ) 
          { cols.push(cur.trim()); cur = ""; }
          else cur += c;
        }
        cols.push(cur.trim());

        const s1  = cols[0] || "";
        const s2  = cols[1] || "";
        const raw = cols[2] || "";
        if (!s1 || !s2) return;

        allSatSet.add(s1);
        allSatSet.add(s2);

        //checking for collision prob value
        if (raw !== "") 
        {
          const val = parseFloat(raw);
          if (!isNaN(val)) 
          {
            //order of names does not matter
            const key = [s1, s2].sort().join("|||");
            pairMap[key] = val;
          }
        }
      });

      //populating dtatlist
      const allSats = [...allSatSet].sort();
      const datalist = document.getElementById('list-sats');
      datalist.innerHTML = "";
      allSats.forEach(name => 
      {
        const opt = document.createElement('option');
        opt.value = name;
        datalist.appendChild(opt);
      });

      const pairCount = Object.keys(pairMap).length;
      document.getElementById('badge').textContent =
        allSats.length.toLocaleString() + " satellites · " +
        pairCount.toLocaleString() + " pairs with data";

      box.innerText = "SELECT SATELLITES";
      box.className = "bg-grey";

    } 
    catch(e) 
    {
      box.innerText = "ERROR LOADING DATA";
      box.className = "bg-high";
      console.error(e);
    }
  }

  //collision risk checking
  function checkRisk() {
    const val1 = document.getElementById('sat1').value.trim();
    const val2 = document.getElementById('sat2').value.trim();
    const box  = document.getElementById('risk-box');
    box.className = "";

    if (!val1 || !val2) {
      box.innerText = "SELECT SATELLITES";
      box.className = "bg-grey";
      return;
    }

    if (val1 === val2) {
      box.innerText = "SAME SATELLITE";
      box.className = "bg-high";
      return;
    }

    //sorting names to match stored key
    const key  = [val1, val2].sort().join("|||");
    const risk = pairMap[key];

    //shows if no collision data is found on csv
    if (risk === undefined || risk === null) {
      box.innerText = "NO DATA FOUND";
      box.className = "bg-grey";
      return;
    }

    
    const pct = risk * 100; // percentage

    box.innerText = pct.toFixed(2) + "% COLLISION RISK";

    if(pct < 33) 
    {box.className = "bg-low";}
    else if (pct < 66)
    {box.className = "bg-mid";}
    else 
    {box.className = "bg-high";}
  }

  // ── Events ─────────────────────────────────────────────────────────────
  document.getElementById('sat1').addEventListener('input', checkRisk);
  document.getElementById('sat2').addEventListener('input', checkRisk);

  loadData();
</script>
</body>
</html>
